<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Code Editor</title>

    <!-- Vendor fallbacks — must load BEFORE any CDN script so shims are ready
         if a CDN tag fires onerror or silently 404s. -->
    <script src="js/vendor-fallbacks.js"></script>

    <!-- CodeMirror Base -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/solarized.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <!-- onerror fires if the CDN returns a network error or a non-JS response -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"
            onerror="window.onCodeMirrorLoadFailed()"></script>

    <!-- CodeMirror Diff / Merge Addon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/merge/merge.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/merge/merge.min.js"></script>

    <!-- CodeMirror Mode Support Addon -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/mode/simple.min.js"></script>

    <!-- CodeMirror Modes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script>
        // Ensure TypeScript and JSX MIME types are registered — the minified CDN
        // build of the JavaScript mode may not include these definitions.
        // Guard against CM failing to load (onCodeMirrorLoadFailed handles that case).
        if (typeof CodeMirror !== 'undefined') {
            if (CodeMirror.resolveMode('text/typescript').name === 'null') {
                CodeMirror.defineMIME('text/typescript', { name: 'javascript', typescript: true });
            }
            if (CodeMirror.resolveMode('text/jsx').name === 'null') {
                CodeMirror.defineMIME('text/jsx', { name: 'javascript', jsx: true });
            }
            if (CodeMirror.resolveMode('text/typescript-jsx').name === 'null') {
                CodeMirror.defineMIME('text/typescript-jsx', { name: 'javascript', typescript: true, jsx: true });
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/php/php.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/sql/sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/yaml/yaml.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/shell/shell.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/rust/rust.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/go/go.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/stex/stex.min.js"></script>

    <!-- CodeMirror Addons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/dialog/dialog.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/show-hint.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldgutter.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/lint/lint.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/scroll/annotatescrollbar.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldgutter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/brace-fold.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/indent-fold.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/closetag.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/selection/active-line.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/search/search.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/search/searchcursor.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/dialog/dialog.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/html-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/javascript-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/css-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/sql-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/comment/comment.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/scroll/annotatescrollbar.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/search/matchesonscrollbar.min.js"></script>

    <!-- Linting Addon & Linters -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jshint/2.13.4/jshint.min.js"></script>
    <script>/* Minimal jsonlint shim — json-lint.js only needs jsonlint.parse(str) to throw on bad JSON, which JSON.parse already does */
    window.jsonlint = { parse: function(str) { return JSON.parse(str); } };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/csslint/1.0.5/csslint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/lint/lint.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/lint/javascript-lint.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/lint/json-lint.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/lint/css-lint.js"></script>

    <!-- Other Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.2/dist/markdown-it.min.js"></script>

    <!-- Prettier for Formatting -->
    <script src="https://unpkg.com/prettier@2.8.1/standalone.js"></script>
    <script src="https://unpkg.com/prettier@2.8.1/parser-babel.js"></script>
    <script src="https://unpkg.com/prettier@2.8.1/parser-html.js"></script>
    <script src="https://unpkg.com/prettier@2.8.1/parser-postcss.js"></script>
    <script src="https://unpkg.com/prettier@2.8.1/parser-markdown.js"></script>
    <script src="https://unpkg.com/prettier@2.8.1/parser-yaml.js"></script>
    <script src="https://unpkg.com/prettier@2.8.1/parser-typescript.js"></script>
    <script src="https://unpkg.com/prettier@2.8.1/parser-graphql.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-actions">
            <button onclick="newProject()" title="New Project">New Project</button>
            <input type="file" id="directoryInput" webkitdirectory multiple style="display: none;" onchange="handleDirectoryUpload(event)">
            <button onclick="document.getElementById('directoryInput').click()" title="Open Directory">Open Directory</button>
            <button id="downloadBtn" onclick="downloadProject()" title="Download Project as Zip">Download Project</button>
            <input type="file" id="fileUploadInput" style="display: none;" onchange="handleFileUpload(event)">
            <button onclick="document.getElementById('fileUploadInput').click()" title="Upload File">Upload File</button>
        </div>

        <!-- Recent Files Section -->
        <div class="sidebar-section" id="recentFilesSection">
            <div class="sidebar-section-header" onclick="toggleRecentFiles()">
                <span class="sidebar-section-icon" id="recentFilesIcon">▶</span>
                <span>Recent Files</span>
            </div>
            <div class="sidebar-section-body" id="recentFilesBody" style="display: none;">
                <div id="recentFilesList"></div>
            </div>
        </div>

        <!-- File Explorer Section -->
        <div class="sidebar-section sidebar-section-explorer">
            <div class="sidebar-section-header" onclick="toggleFileExplorer()">
                <span class="sidebar-section-icon" id="fileExplorerIcon">▼</span>
                <span>File Explorer</span>
            </div>
            <div class="sidebar-section-body" id="fileExplorerBody">
                <div class="file-tree" id="fileTree"></div>
            </div>
        </div>
    </div>

    <div class="resize-handle" id="resizeHandle"></div>

    <div class="editor-container" id="editorContainer">
        <div class="tabs-wrap">
            <div class="tabs" id="tabs"></div>
            <button class="new-tab-btn" onclick="newTab()" title="New Tab">+</button>
        </div>
        <div class="breadcrumb-bar" id="breadcrumbBar"><span class="breadcrumb-empty">No file open</span></div>
        <div class="editor-header">
            <div class="left-buttons">
                <button onclick="toggleSidebar()" title="Toggle Sidebar">≡</button>
                <button onclick="newTab()" title="New Untitled File (Ctrl+N)">New Tab</button>
                <button onclick="saveCurrentFile()" title="Save Current File (Ctrl+S)">Save</button>
                <button onclick="openLocalSearch()" title="Find/Replace in File (Ctrl+F)">Find/Replace</button>
                <div class="toolbar-overflow-wrap">
                    <button class="toolbar-overflow-btn" onclick="toggleToolbarMenu(event)" title="More actions">···</button>
                    <div class="toolbar-overflow-menu" id="toolbarOverflowMenu">
                        <div onclick="downloadCurrentFile(); closeToolbarMenu()">Download File</div>
                        <div onclick="formatCode(); closeToolbarMenu()">Format Code <span class="toolbar-menu-shortcut">Ctrl+Shift+F</span></div>
                        <div onclick="toggleWordWrap(); closeToolbarMenu()" id="wrapToggleMenuItem">Word Wrap <span class="toolbar-menu-shortcut" id="wrapToggleShortcut"></span></div>
                        <div onclick="openGoToLine(); closeToolbarMenu()">Go to Line… <span class="toolbar-menu-shortcut">Ctrl+G</span></div>
                        <div onclick="copyEditorContent(); closeToolbarMenu()">Copy Contents</div>
                        <div class="context-menu-sep"></div>
                        <div onclick="saveAllFiles(); closeToolbarMenu()">Save All <span class="toolbar-menu-shortcut">Ctrl+Shift+S</span></div>
                        <div onclick="downloadProject(); closeToolbarMenu()">Download Project (ZIP)</div>
                        <div onclick="closeAllTabs(); closeToolbarMenu()">Close All Tabs</div>
                    </div>
                </div>
            </div>
            
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Global Search (Ctrl+Shift+G)..." class="header-input">
                <input type="text" id="replaceInput" placeholder="Replace with..." class="header-input">
                <button id="globalSearchCaseBtn" onclick="toggleGlobalSearchCase()" title="Match Case" class="header-btn search-toggle-btn">Aa</button>
                <button onclick="performGlobalReplace()" class="header-btn" title="Replace All Across Project">Replace All</button>
                <button onclick="clearSearch()" class="header-btn" title="Clear Search">Clear</button>
            </div>

            <div class="right-buttons">
                <button id="diffBtn" onclick="toggleDiff()" title="View Unsaved Changes vs Last Save">Diff</button>
                <button id="previewBtn" onclick="togglePreview()" title="Toggle Preview for supported files (HTML, Markdown, LaTeX, CSV, XLSX, SVG, images — see README)">Preview</button>
                <button id="consoleToggleBtn" onclick="toggleConsolePanel()" title="Toggle Console (Ctrl+`)">Console</button>
                <button onclick="toggleSettings()" title="Editor Settings">Settings</button>
            </div>
        </div>
        
        <div class="editor-split" id="editorSplit">
            <div class="editor-pane" id="editorPane">
                
                <!-- Floating Local Search Widget -->
                <div id="localSearchWidget" class="local-search-widget" style="display: none;">
                    <div class="search-row">
                        <input type="text" id="localSearchInput" placeholder="Find in file...">
                        <span id="localSearchCount">0/0</span>
                        <button id="localSearchCaseBtn" onclick="toggleLocalSearchCase()" title="Match Case (Alt+C)" class="search-toggle-btn">Aa</button>
                        <button id="localSearchRegexBtn" onclick="toggleLocalSearchRegex()" title="Use Regular Expression (Alt+R)" class="search-toggle-btn">.*</button>
                        <button onclick="findNextLocal()" title="Next (Enter)">↓</button>
                        <button onclick="findPrevLocal()" title="Previous (Shift+Enter)">↑</button>
                        <button onclick="toggleLocalReplace()" title="Toggle Replace (Ctrl+H)">🔁</button>
                        <button onclick="closeLocalSearch()" title="Close (Esc)">×</button>
                    </div>
                    <div class="replace-row" id="localReplaceRow" style="display: none;">
                        <input type="text" id="localReplaceInput" placeholder="Replace with...">
                        <button onclick="replaceLocal()" title="Replace (Enter)">Replace</button>
                        <button onclick="replaceAllLocal()" title="Replace All">All</button>
                    </div>
                </div>

                <!-- Restored working layout: NO inline flex styles! -->
                <div id="codeEditor"></div>
                <div id="diffContainer" style="display: none; height: 100%; flex-direction: column;"></div>
            </div>
            <div id="minimapWrap" class="minimap-wrap"></div>
            <div class="resize-handle-vertical" id="editorPreviewResizeHandle"></div>
            <div class="preview-pane" id="previewPane">
                <iframe id="previewFrame" sandbox="allow-scripts" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>
        
        <div id="searchResults"></div>

        <!-- Console Panel: spans the full editor width under editor, minimap and preview -->
        <div class="console-panel" id="consolePanel" style="display: none;" tabindex="-1">
            <div class="resize-handle-horizontal" id="consoleResizeHandle"></div>
            <div class="console-header">
                <span class="console-title">Console</span>
                <button id="consoleRunBtn" class="console-run-btn" onclick="consoleRunning ? stopConsoleRun() : runActiveFileInConsole()" title="Run active file (Ctrl+Enter)">▶ Run</button>
                <div class="console-filters">
                    <button class="console-filter-chip active" data-filter="all" onclick="setConsoleFilter('all')">All</button>
                    <button class="console-filter-chip" data-filter="log" onclick="setConsoleFilter('log')">Log</button>
                    <button class="console-filter-chip" data-filter="warn" onclick="setConsoleFilter('warn')">Warn</button>
                    <button class="console-filter-chip" data-filter="error" onclick="setConsoleFilter('error')">Error</button>
                </div>
                <span class="console-spacer"></span>
                <button class="console-clear-btn" onclick="clearConsole()" title="Clear (Ctrl+L inside the console)">Clear</button>
                <button class="console-close-btn" onclick="closeConsolePanel()" title="Close Console">&times;</button>
            </div>
            <div class="console-output" id="consoleOutput" role="log" aria-live="polite"></div>
        </div>
        
        <div class="status-bar" id="statusBar">
            <span class="console-badge" id="consoleBadge" style="display: none;" onclick="openConsolePanel()" title="Open Console"></span>
            <span class="notification" id="notification"></span>
            <span id="statusContent"></span>
        </div>
        
        <!-- Settings Modal -->
        <div id="settingsOverlay" class="modal-overlay" style="display: none;" onclick="handleSettingsOverlayClick(event)">
            <div class="modal-box settings-modal-box" onclick="event.stopPropagation()">
                <div class="modal-header">
                    <h3>Settings</h3>
                    <span class="modal-close-x" onclick="toggleSettings()" title="Close">&times;</span>
                </div>
                <div class="modal-body settings-modal-body">
                    <div class="settings-section">
                        <div class="settings-section-title">Editor</div>
                        <label class="settings-label"><input type="checkbox" id="autoCloseTags" checked> Auto-Close Tags</label>
                        <label class="settings-label"><input type="checkbox" id="matchBrackets" checked> Match Brackets</label>
                        <label class="settings-label"><input type="checkbox" id="autoCloseBrackets" checked> Auto-Close Brackets</label>
                        <label class="settings-label"><input type="checkbox" id="bracketColorization" checked> Bracket Pair Colorization</label>
                        <label class="settings-label"><input type="checkbox" id="activeLineHighlight" checked> Active Line Highlight</label>
                        <label class="settings-label"><input type="checkbox" id="foldGutter" checked> Code Folding</label>
                        <label class="settings-label"><input type="checkbox" id="wordWrap"> Word Wrap</label>
                        <label class="settings-label"><input type="checkbox" id="fileTemplates" checked> File Templates on New File</label>
                        <label class="settings-label settings-label-row">
                            <span>Delete key window (ms)</span>
                            <input type="number" id="treeDeleteWindowMs" min="200" max="5000" value="1500" class="settings-number-input">
                        </label>
                    </div>
                    <div class="settings-section">
                        <div class="settings-section-title">Session</div>
                        <label class="settings-label"><input type="checkbox" id="autoSaveSession"> Auto-Save/Load Session</label>
                        <label class="settings-label"><input type="checkbox" id="autoSaveOnBlur"> Auto-Save on Focus Loss</label>
                        <label class="settings-label"><input type="checkbox" id="autoSaveInterval"> Timed Auto-Save</label>
                        <label class="settings-label settings-label-row" id="autoSaveIntervalMsRow">
                            <span>Save interval (seconds)</span>
                            <input type="number" id="autoSaveIntervalMs" min="5" max="3600" value="30" class="settings-number-input">
                        </label>
                    </div>
                    <div class="settings-section">
                        <div class="settings-section-title">Appearance</div>
                        <label class="settings-label settings-label-row">
                            <span>Theme</span>
                            <select id="themeSelect">
                                <option value="default">Light</option>
                                <option value="monokai" selected>Dark (Monokai)</option>
                                <option value="solarized dark">Solarized Dark</option>
                                <option value="solarized light">Solarized Light</option>
                                <option value="dracula">Dracula</option>
                            </select>
                        </label>
                        <label class="settings-label settings-label-row">
                            <span>Tab Width</span>
                            <select id="tabWidthSelect">
                                <option value="2">2 spaces</option>
                                <option value="4" selected>4 spaces</option>
                                <option value="8">8 spaces</option>
                            </select>
                        </label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="modal-btn-cancel" onclick="resetSettings()">Reset to Default</button>
                    <button class="modal-btn-primary" onclick="toggleSettings()">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Command Palette -->
    <div id="commandPalette" class="modal-overlay" style="display: none;">
        <div class="palette-box">
            <input type="text" id="paletteInput" placeholder="Search commands... (e.g., Format, Search, Save)">
            <ul id="paletteList"></ul>
        </div>
    </div>

    <!-- File Search Palette -->
    <div id="filePalette" class="modal-overlay" style="display: none;" onclick="handleFilePaletteOverlayClick(event)">
        <div class="palette-box">
            <input type="text" id="filePaletteInput" placeholder="Search files by name...">
            <ul id="fileList"></ul>
        </div>
    </div>

    <!-- Symbol Outline Palette -->
    <div id="symbolPalette" class="modal-overlay" style="display: none;" onclick="handleSymbolPaletteOverlayClick(event)">
        <div class="palette-box">
            <input type="text" id="symbolPaletteInput" placeholder="Go to symbol… (functions, classes, headings)">
            <ul id="symbolList"></ul>
        </div>
    </div>

    <!-- Custom Scripts -->
    <!-- Activate any vendor fallbacks needed (called after all CDN scripts) -->
    <script>if (typeof initVendorFallbacks === 'function') initVendorFallbacks();</script>
    <!-- Submodules -->
    <script src="js/filetree/render.js"></script>
    <script src="js/filetree/treeOps.js"></script>
    <script src="js/filetree/contextMenu.js"></script>
    <script src="js/filetree/dragDrop.js"></script>
    <script src="js/globals.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/latex.js"></script>
    <script src="js/csvViewer.js"></script>
    <script src="js/symbols.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/fileTree.js"></script>
    <script src="js/tabs.js"></script>
    <script src="js/fileOps.js"></script>
    <script src="js/formatLatex.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/session.js"></script>
    <script src="js/minimap.js"></script>
    <script src="js/console.js"></script>
    <script src="js/console-python.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
